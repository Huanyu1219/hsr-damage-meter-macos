name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-validation.lock
      - name: Install schema validator
        run: python -m pip install -r scripts/requirements-validation.lock
      - name: Swift format
        run: xcrun swift-format lint --strict --recursive macos/HSRDamageMeter
      - name: Swift tests
        run: swift test --package-path macos/HSRDamageMeter -j 2
      - name: Cross-language protocol contract
        run: |
          cargo build --manifest-path collector/Cargo.toml --locked --bin fixture-roundtrip
          swift build --package-path macos/HSRDamageMeter --product fixture-roundtrip
          python scripts/validate-fixtures.py
      - name: Build app
        run: ./scripts/build-macos-app.sh

  rust-and-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-validation.lock
      - name: Install schema validator
        run: python -m pip install -r scripts/requirements-validation.lock
      - name: Rust format
        run: cargo fmt --manifest-path collector/Cargo.toml --all -- --check
      - name: Rust tests
        run: cargo test --manifest-path collector/Cargo.toml --locked
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
