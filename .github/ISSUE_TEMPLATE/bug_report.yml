name: Bug report
description: 报告可复现的错误
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传真实战斗记录、游戏目录、帐号信息或 DLL。安全问题请按 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: App 与 Collector 版本
      placeholder: App 0.1.0 / Collector 0.2.52
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: macOS 版本、Mac 型号、Wine 工具
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，并移除了私人信息。
          required: true
